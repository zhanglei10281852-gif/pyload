rubrics:
  - id: 1
    type: f2p
    text: 删除活动文件会有界取消 downloader/decrypter 及其请求资源，成功返回后不再有该条目的活动线程、网络句柄或迟到状态写入。
  - id: 2
    type: f2p
    text: 取消在期限内不能确认时，删除返回确定的可重试失败，数据库、缓存和队列仍保留可管理的原条目且不发布 remove 或 package_deleted 成功事件。
  - id: 3
    type: f2p
    text: 数据库删除或提交失败时，目标条目在缓存与持久记录中都保持可见并处于停止或可重试状态，同包其他文件、包存在性和顺序不发生部分提交。
  - id: 4
    type: f2p
    text: 删除含多个活动 downloader/decrypter 的整包按一个结果收敛，任一子项取消失败都不会留下部分释放、部分删除或空壳包。
  - id: 5
    type: f2p
    text: 并发或重复删除、worker 的 finally 收尾和已排队重试不会复活已提交删除，也不会重复发送客户端删除事件或插件回调。
  - id: 6
    type: p2p
    text: 未运行文件与包的现有删除、最后一个文件触发空包清理、队列和收集器顺序压缩行为保持不变。
  - id: 7
    type: p2p
    text: 正常 HTTP、XDCC 和解密任务在未被删除时继续按现有状态保存、完成和事件路径运行，既有 API 权限与批量删除输入保持兼容。
