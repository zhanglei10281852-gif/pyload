rubrics:
  - id: 1
    type: f2p
    text: 同一在线检查进度的重复轮询可重放同一批数据，只有明确推进后才返回后续批次，模拟响应丢失不会遗漏 URL 结果。
  - id: 2
    type: f2p
    text: 两个消费者并发轮询同一作业时拥有独立进度，任何一方的读取、重试或确认都不会窃取、跳过或重复推进另一方。
  - id: 3
    type: f2p
    text: InfoThread 的部分批次、最后一批和 completed 终态保持稳定顺序，客户端能在取得全部结果后观察到既有 rid=-1 完成语义。
  - id: 4
    type: f2p
    text: 每个作业独立过期，清理闲置作业不影响仍活跃的作业；插件异常、容器失败和过期分别产生可确定且可区分的终态。
  - id: 5
    type: f2p
    text: 服务重启后旧作业身份明确返回未知或过期，新的检查不会复用身份而把其结果交给重启前的轮询者。
  - id: 6
    type: p2p
    text: 单消费者旧式调用仍可使用现有 checkOnlineStatus、pollResults、OnlineCheck 字段和 rid=-1，不启用进度能力时行为兼容。
  - id: 7
    type: p2p
    text: 缓存命中、插件默认 unknown、按插件分组和容器预解密的正常结果保持现有名称、大小、状态和包名解析行为。
